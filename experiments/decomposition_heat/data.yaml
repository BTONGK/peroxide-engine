# Published heats of decomposition, as printed. Solvay Chemicals, "Hydrogen Peroxide Safety & Handling", Technical
# Data Sheet HH-2323, 08/2019, page 3: Table One and the decomposition equation below it.
source:
  cite: Solvay Chemicals 2019
  reference: "Solvay Chemicals, Inc., Hydrogen Peroxide Safety & Handling, Technical Data Sheet HH-2323 (08/2019)"
  url: https://www.solvay.com/sites/g/files/srpend221/files/2019-10/H2O2%20Safety%20and%20Handling%20of%20Hydrogen%20Peroxide.pdf
  locator: page 3, Table One (heat of decomposition at 25 °C) and the equation 2H2O2(l) -> 2H2O(l) + O2(g) + 1240 BTU/lb of 100% H2O2
per_pound_of_solution:   # Btu per lb of solution at 25 °C
  - {mass_fraction: 0.35, printed: "420"}
  - {mass_fraction: 0.50, printed: "603"}
  - {mass_fraction: 0.70, printed: "852"}
  - {mass_fraction: 1.00, printed: "1240", basis: "per lb of 100% H2O2"}
per_mole:                # kcal per mol H2O2 at 25 °C
  - {mass_fraction: 0.35, printed: "22.7"}
  - {mass_fraction: 0.50, printed: "22.8"}
  - {mass_fraction: 0.70, printed: "23.4"}
