# Dissolved catalysts. Iron(III) runs through its checked mechanism (catalysts/iron.py).

- id: iron_iii_de_laat
  name: Iron(III) in perchloric acid
  class: dissolved
  material: "Ferric perchlorate, 50–1000 µM, pH 1.0–3.2, 25 °C, ionic strength 0.1 M"
  status: ready
  law:
    kind: mechanism
    module: iron
    summary: >-
      De Laat and Gallard's fifteen-step mechanism, checked against their 22 measured rates with its fitted constant
      held out, and against Barb et al.'s 1951 rates; choose it on the Run page as "Dissolved iron(III) in perchloric
      acid".
  source:
    cite: De Laat & Gallard 1999
    reference: "J. De Laat, H. Gallard, Environ. Sci. Technol. 33, 2726 (1999)"
    doi: 10.1021/es981171v
    locator: Table 2 and Tables 3–4

