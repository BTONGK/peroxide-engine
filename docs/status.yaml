updated: 2026-10-31
summary: >-
  Phases 0 to 2 are built: the scaffold, constants with provenance, the exact physics of the experiment (heat, oxygen
  solubility, the vessel, assays and the lab's fits), and dissolved iron(III) by the De Laat and Gallard mechanism.
  Six checks pass. The seventh, against another laboratory, passes for rates and misses for iron(II), so the app shows
  iron rates and keeps iron(II) in the Methodology limits.

