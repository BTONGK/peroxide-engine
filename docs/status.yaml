  - Heat capacity of peroxide solutions (Giguère and Carmichael 1962), for heat at other temperatures and the temperature rise. The PDF saved for it, jp9b01057.pdf, is Li and Buckin 2019 (oxygen in supersaturated solutions); the paper needed is doi 10.1021/je60015a024.
  - A measured hydroxyl radical yield for iron (a benzoic acid or dimethyl sulfoxide trap), to check that output.
  - Phase 3, catalase and the enzyme library.

