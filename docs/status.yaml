findings:
  - >-
    Lousada's 2013 thesis, Table 3, gives the CeO2 and CuO second-order constants exchanged; its Figure 16 and the
    k1 values in the same table follow the other assignment.
  - >-
    De Laat and Gallard's eq 24, as printed, drops the factor 2 that follows from their eqs 21 and 22. With it, kd at
    pH 3 is 0.51 L/(mol·s), beside the 0.47 ± 0.03 they measured; as printed, 0.25.
  - >-
    The iron model, built in perchlorate at ionic strength 0.1 M, predicts Barb et al.'s 1951 rates in nitrate at
    0.435 M within 20% typically. Its iron(II) runs a third below Barb's, and Barb's own rate with the Fenton constant
    gives the same low value.
  - >-
    Fitting k6 to all 22 of De Laat and Gallard's runs gives 2.74e-3 per second, beside their published 2.7e-3.
  - >-
    Mixing H2O2 with water releases heat, so the heat of decomposition rises from 94.66 kJ/mol (dilute) to 95.0 (35%),
    95.4 (50%), 96.2 (70%) and 98.05 (pure); the NBS dilution series reproduces Solvay's published heats within 0.1%.
  - >-
    Where the oxygen ends up changes the heat a calorimeter sees by 6%: 100.67 kJ/mol while it stays dissolved, 94.66
    once it leaves as gas, and less again at a burette, where the new gas carries water vapor away.
  - >-
    An initial rate measured over the first 10% of a first-order decay reads about 5% below k × [H2O2]0.

