summary: >-
  Phases 0 and 1 are built: the scaffold, constants with provenance, and the exact physics of the experiment (heat,
  oxygen solubility, the vessel, assays and the lab's fits), with four checks passed. Phase 2, dissolved iron, starts
  once its papers are in cache/papers/.

