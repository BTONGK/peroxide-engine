  - {n: 1, name: Exact physics, state: done, summary: "Heat from the NBS tables, oxygen solubility, water, the vessel with burette, sealed and open arrangements, titrations, the lab's fits."}
  - {n: 2, name: Dissolved iron, state: done, summary: "The De Laat and Gallard Fe(III) mechanism at 25 °C, pH 1.0–3.2, in perchlorate; rates checked against their 22 runs with k6 held out and against Barb et al. 1951. The •OH yield and iron(II) wait for a check."}
  - {n: 3, name: Measured catalyst library, state: next, summary: "Every class selectable on the Run page from measured rates inside their measured ranges: ZrO2 and HfO2 ready; catalases, iodide, copper, more oxides and platinum-group metals as their papers arrive."}
  - {n: 4, name: Oxides and metals by formula, state: planned, summary: "Crystal from the Materials Project, •OH binding from Meta's UMA model, scored against the measured oxides; shown once its ranking passes."}
  - {n: 5, name: Catalase and enzymes, state: planned, summary: "Chance's scheme with inactivation, so rates follow H2O2 and time; constants per enzyme from Switala and Loewen 2002."}
  - {n: 6, name: Iodide and copper, state: planned, summary: "Liebhafsky's rate law with the Bray-Liebhafsky steps; copper after Pham et al. 2013."}
  - {n: 7, name: Vapor, state: planned, summary: "Peroxide vapor over catalysts."}

recent:
  - date: 2026-10-31
    text: >-
      Started the measured catalyst library and its page. Every catalyst class is listed with its source; ZrO2 and
      HfO2 powders run on the Run page inside the loadings, temperatures and H2O2 their laboratory measured, and
      their values pass a consistency check against the thesis they come from. Twelve entries wait for papers, each
      named on the Catalyst library page. Reading the thesis found its Table 3 exchanging the CeO2 and CuO constants.
  - date: 2026-10-31
    text: >-
      Added dissolved iron(III). The engine solves De Laat and Gallard's fifteen-step mechanism in time, with
      hydrolysis and the two hydroperoxy complexes held at balance, and the Run page computes every readout from it.
      Three checks: the constants and equations as printed (passed); the 22 measured rates across pH, iron and
      peroxide with the one fitted constant set from a separate table (passed, every run within a factor of 2, largest
      gap 1.42); Barb et al.'s 1951 rates and iron(II) (rates within a factor of 2, typical gap 1.18; iron(II) a
      factor of 1.52 low, above the rule's 1.41, so missed and kept off the app).
  - date: 2026-10-31
    text: >-
      The app opens on the first free port from 8502 (or the one given with --port), so it runs beside the catalyst
      engine's app on 8501. The repository is public at github.com/BTONGK/peroxide-engine.
  - date: 2026-10-31
    text: >-
      Built the engine's physics with every constant traced to a page: NBS tables (72 values, checked against NIST's
      CSV and the scanned pages), IAPWS water, Benson-Krause-Peterson oxygen solubility. Four checks passed:
      transcription, heat of decomposition against Solvay's safety data (within 0.1%), oxygen solubility against
      Battino's fifteen-source evaluation (within 0.44% from 5 to 55 °C) and the USGS formula (within 0.07%), and exact
      solutions with oxygen conserved to 1e-14.

