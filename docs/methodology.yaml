intro: >-
  Every number on this app comes from a measurement with a named source, or from a model that reproduced
  measurements it was built apart from. Each model passes a rule written down before its comparison; the rules and
  results sit on the Model checks page. A model that has yet to pass stays off the app and appears below under
  "What comes later".

sections:
  - title: What the engine computes today
    body: >-
      You choose a catalyst: dissolved iron(III) in perchloric acid, whose rate the engine computes from its reaction
      mechanism; a measured catalyst from the library, whose rate a laboratory measured; or any catalyst whose
      first-order rate constant k you supply (from your own measurement or a paper).
      With the conditions of an experiment, the engine then computes what the instruments in a peroxide lab would read as the reaction runs:
      the H2O2 left, the rate, the oxygen formed, the oxygen dissolved in the liquid, the gas collected in a burette or
      the pressure in a sealed vessel, the heat and heat flow a calorimeter records, and the titration volumes for
      permanganate and iodometric assays. It also applies the fits a lab applies (rate constant, half-life, initial
      rate), so you see the numbers as a lab would report them.

  - title: The reaction and its energy
    body: >-
      Hydrogen peroxide breaks into water and oxygen: H2O2 → H2O + ½ O2. In dilute solution this releases 94.66 kJ
      per mole of H2O2 when the oxygen leaves as gas, and 100.67 kJ when it stays dissolved; pure H2O2 releases
      98.05 kJ. These come from the enthalpies of formation in the NBS tables (Wagman et al. 1982), which also give the
      heat of mixing H2O2 with water at every strength, so the heat of a 35% solution (95.0 kJ/mol) is computed from
      measurements too. The equilibrium constant, 10^18.06, places the reaction entirely on the side of water and
      oxygen, so every catalyst only changes how fast it goes.
    equations:
      - "ΔrH = ΔfH(H2O, l) − ΔfH(H2O2 in n H2O), the NBS dilution series interpolated smoothly in n/(n+1)"
      - "ΔrG = −103.10 kJ/mol (dilute), log10 K = −ΔrG / (RT ln 10) = 18.06 at 25 °C"
      - "Heat to dissolved O2 = 94.66 + ½ × 12.01 kJ/mol, where 12.01 kJ/mol is oxygen's enthalpy of solution"
    uncertainty: >-
      The NBS tables give each value to a digit chosen so that its uncertainty lies between 8 and 80 units of the last
      digit, on a two-standard-deviation scale. The engine quotes the upper end: 0.8 kJ/mol (0.85%) for the heat of
      decomposition and 0.14 in log10 K.

  - title: Water
    body: >-
      Water's vapor pressure and density come from the IAPWS saturation equations (1992), the international standard.
      The vapor pressure sets how much of a burette's gas is water; the density converts between mole fraction and
      concentration.

  - title: Oxygen in the liquid and the gas
    body: >-
      Oxygen's solubility comes from Benson, Krause and Peterson (1979), the most precise gas solubility measured
      (scatter 0.017%), which Battino and coworkers recommend as the reference for oxygen in water. The dissolved
      oxygen at any partial pressure follows Henry's law with Benson and Krause's small correction for the gas's
      departure from ideal behavior. The liquid starts saturated with air. During a run the dissolved oxygen either
      stays in balance with the gas above it, or crosses the surface at the rate kLa (c − c*), where kLa is your
      vessel's oxygen transfer coefficient and c* the saturation value; with a finite kLa the liquid supersaturates as
      it does in a real flask.
    equations:
      - "−ln x = 3.71814 + 5596.17/T − 1049668/T², x at 101.325 kPa O2 (Benson, Krause and Peterson 1979)"
      - "c* = x(T) × (p_O2 / 1 atm) × (1 − θP)/(1 − θ), converted to mol/L with the density of water"
      - "Enthalpy of solution = R (B + 2C/T) = −12.01 kJ/mol at 25 °C, from the temperature slope"

  - title: The experiment
    body: >-
      The vessel holds a stirred liquid at constant temperature under a gas space. Three arrangements match the usual
      apparatus. A gas burette holds the room's pressure, and its volume grows as oxygen leaves the liquid. A sealed
      vessel has a fixed gas volume, so its pressure climbs. An open vessel lets oxygen join the room air. Gases follow
      the ideal gas law and the gas above the liquid stays saturated with water vapor. Oxygen is tracked atom by atom:
      what the liquid and gas started with, plus what the reaction makes, equals what is in the liquid, the gas and the
      room at every moment.
    equations:
      - "d[H2O2]/dt = −k [H2O2] (first order; the exact solution is used when oxygen stays in balance)"
      - "d[O2]liq/dt = ½ k [H2O2] − kLa ([O2]liq − c*)"
      - "Heat flow = V (rate × 100.67 kJ/mol − O2 transfer × (12.01 kJ/mol + water carried × 44.01 kJ/mol))"

  - title: What the readouts mean
    body: >-
      The rate constant is fitted to the computed H2O2 curve by a straight line through ln[H2O2] against time, as a lab
      fits its data. The initial rate is the slope over the first 10% of the reaction, so for a first-order reaction
      it sits about 5% below k × [H2O2]0, exactly as a lab's would. The burette volume is the wet gas at the vessel's
      temperature and the room's pressure; the dry volume at 0 °C and 1 atm removes the water vapor. Heat appears for
      runs at 25 °C, where the tables measure it, in the burette and sealed arrangements, whose energy accounting is
      complete.

  - title: Dissolved iron(III)
    body: >-
      Iron(III) in acid decomposes peroxide by a chain of single-electron steps, measured and assembled by De Laat and
      Gallard (1999). Iron(III) first binds peroxide as two hydroperoxy complexes, FeIII(HO2)2+ and FeIII(OH)(HO2)+,
      whose formation constants Gallard, De Laat and Legube measured by their color (1999). Each complex splits slowly
      into iron(II) and the HO2 radical, the one constant fitted to the decomposition runs (k6 = 2.7 × 10⁻³ per
      second). Iron(II) then reacts with peroxide to give the hydroxyl radical (the Fenton reaction, 63 L/(mol·s)), and
      the radicals HO2, O2⁻ and OH carry the chain: they turn iron(II) back into iron(III), iron(III) back into
      iron(II), and peroxide into oxygen, until two radicals meet. The engine solves all fifteen steps in time, with
      iron(III)'s reactions with water (hydrolysis to FeOH2+, Fe(OH)2+ and the dimer) and with peroxide held at
      balance, as De Laat and Gallard did, because they form far faster than the peroxide decomposes. The radical
      constants are pulse radiolysis measurements as De Laat and Gallard selected them; each constant's note compares
      it with the compilations of Buxton et al. (1988) and Bielski et al. (1985), and every constant, with its source
      and spread, is on the "every source value" tab. A run starts with iron(II) and the radicals at zero, so the rate
      climbs over the first minute (at pH 3, 200 µM iron and 50 mM H2O2: 0.4% of its full value at the start, 92% at
      30 seconds) before it follows the slow decline; on a run of hours the heat flow chart shows this as a step.
    equations:
      - "Fe3+ + H2O2 ⇌ FeIII(HO2)2+ + H+ (KI1 = 3.1 × 10⁻³); FeOH2+ + H2O2 ⇌ FeIII(OH)(HO2)+ + H+ (KI2 = 2.0 × 10⁻⁴)"
      - "FeIII(HO2)2+ and FeIII(OH)(HO2)+ → Fe2+ + HO2 (k6 = 2.7 × 10⁻³ 1/s)"
      - "Fe2+ + H2O2 → Fe3+ + OH⁻ + OH (k7 = 63 L/(mol·s))"
      - "OH + H2O2 → HO2 + H2O (3.3 × 10⁷); Fe3+ + O2⁻ → Fe2+ + O2 (5.0 × 10⁷); HO2 ⇌ O2⁻ + H+ (pKa 4.8)"
      - "Free acid [H+] = 10^-pH / 0.85, the activity coefficient at ionic strength 0.1 M"
    uncertainty: >-
      One constant is loosely known: k11a, iron(III) with HO2, which the paper bounds below 2 × 10³ L/(mol·s). The
      engine uses 1 × 10³, the value the same group used in 1998, and shows k_obs at both ends of the bound beside the
      result. The checks repeat every comparison at both ends too.
    checked: >-
      The Model checks page holds three iron checks. The engine reproduces the papers' printed constants and derived
      values. It predicts De Laat and Gallard's twenty-two measured rates across pH, iron and peroxide with k6 set
      from a separate set of their runs. Barb, Baxendale, George and Hargrave's 1951 rates in nitrate solution fall
      within a factor of 2; their iron(II) misses the rule, as the "What comes later" tab explains.

  - title: Measured catalysts
    body: >-
      The Catalyst library holds catalysts whose rate a laboratory measured, each with the values as printed and the
      ranges of H2O2, temperature and catalyst amount the laboratory covered. The app runs a catalyst only inside
      those ranges, so every number it shows rests on a measurement. For an oxide powder, the laboratory measured the
      first-order rate constant at several loadings; its straight line against the surface area per volume gives the
      rate at any loading in that span, and the measured activation energy carries it across the measured
      temperatures. The surface area comes from the loading and the powder's measured B.E.T. area.
    equations:
      - "k_obs = (k2 × Sa/V + b) × exp(−Ea/R × (1/T − 1/298.15 K)), Sa/V = loading × B.E.T. area"
      - "−d[H2O2]/dt = k_obs [H2O2], first order as measured"
    uncertainty: >-
      The readouts give k_obs at the ends of the printed uncertainties of k2, the intercept b and Ea. The
      laboratory's own repeat measurements differ by up to 8% (ZrO2 at 25 °C: 6.15 and 5.67 × 10⁻⁵ per second at the
      same loading).
    checked: >-
      The Model checks page holds the library's consistency check: every stored value matches its printed text, and
      the values reproduce the other rates, temperatures and areas the same source prints.

limits_intro: >-
  These parts of a full peroxide experiment join the app once each passes its check. Each line says what is needed.

limits:
  - title: Catalysts waiting for a paper
    body: >-
      The Catalyst library lists every catalyst class: enzymes (catalases), dissolved catalysts (iodide, copper),
      oxides (CeO2, CuO, Fe2O3, Gd2O3, TiO2, Y2O3, SiO2, Al2O3, MnO2, goethite) and metals (platinum and the platinum
      group). Each joins the Run page once its paper is read and its values pass the consistency check; the library
      page names the paper each one needs.
  - title: Any oxide or metal by its formula
    body: >-
      Next after the library: an oxide or metal named by its formula, with its crystal from the Materials Project and
      the binding of the hydroxyl radical to its surface computed by Meta's UMA model, the measure Lousada et al.
      linked to the decomposition barrier. It joins the app once its ranking of the measured oxides passes a rule
      written before the comparison.
  - title: Rates as they change with conditions
    body: >-
      Mechanisms that let a catalyst's rate follow pH, temperature and loading beyond the measured points (catalase
      with its loss of activity, iodide, copper) join one at a time as each reproduces measured rates within the
      declared rule, as iron did.
  - title: Iron(II) during an iron(III) run
    body: >-
      The mechanism computes the small amount of iron(II) present while iron(III) decomposes peroxide, and Barb et al.
      measured it in 1951. The engine's values run about a third below theirs (typical gap a factor of 1.5, above the
      rule's 1.41), so the app leaves iron(II) off the readouts. Barb's own rate with the Fenton constant gives the
      engine's value, so the gap lies between their two measurements: from their iron(II) values they derived a
      Fenton constant of 42 L/(mol·s), beside the 53 they measured directly. A newer measurement of iron(II) during
      the reaction would settle it.
  - title: Hydroxyl radicals from iron
    body: >-
      The mechanism also gives how many hydroxyl radicals form for each peroxide decomposed, the number that matters
      for Fenton treatment of water. It joins the app once it is checked against a measured yield, for example by a
      radical trap such as benzoic acid or dimethyl sulfoxide.
  - title: Iron at other temperatures, salts and acidities
    body: >-
      The iron model holds for 25 °C, perchlorate at ionic strength 0.1 M and pH 1.0 to 3.2, where its constants were
      measured. Its activation energy is open: Barb et al. measured 24 ± 4 kcal/mol for the overall rate and Walling
      and Goosen about 30. Chloride and sulfate bind iron(III) and change the rate; above pH 3.2 iron(III) begins to
      precipitate, and Kwan and Voelker's runs at pH 4 show the model's trend there only qualitatively. Each joins once
      the constants are measured and a check passes.
  - title: Temperature
    body: >-
      The app runs from 5 to 55 °C. Above 55 °C the two best evaluations of oxygen solubility part by up to 2.6%.
  - title: Heat at temperatures other than 25 °C, and temperature rise
    body: >-
      The tables give the heat at 25 °C. Its change with temperature, and the temperature rise of a vessel that keeps
      its heat, both need the heat capacity of peroxide solutions, measured by Giguère and Carmichael (1962); the
      engine adds them once that paper's numbers are in and checked.
  - title: Strength by weight percent and solutions above 1 mol/L
    body: >-
      The app takes concentrations in mol/L up to 1 mol/L, where the solution behaves as dilute for heat and oxygen.
      Conversion from weight percent needs the densities of peroxide solutions (Easton, Mitchell and Wynne-Jones 1952).
  - title: Salts and peroxide in the liquid
    body: >-
      Oxygen's solubility is computed for pure water. Dissolved salts lower it (the Sechenov effect), by an amount the
      engine adds once the coefficients for the relevant salts are taken from measurements.
  - title: Absorbance assays
    body: >-
      UV absorbance at 240 nm, triiodide at 353 nm and titanium peroxo at 407 nm join once their molar absorption
      coefficients are taken from the primary measurements, since published values differ between papers.
  - title: Bubbles
    body: >-
      Oxygen leaves the liquid through its surface at the rate kLa. Bubbles that form on a catalyst speed this up; you
      can stand for them with a larger kLa measured in your own vessel.

audit:
  - >-
    Each NBS value was read against the scanned page of the 1982 tables (pp. 2-37, 2-38) and compared character by
    character with NIST's digitized CSV, whose SHA-256 matches NIST's published checksum; all 72 values match.
  - >-
    The uncertainty rule (8 to 80 units of the last digit, two-standard-deviation scale) and the convention for
    solutions "H2O2 in n H2O" were read from the tables' introduction (section 4.2, p. 2-16, and p. 2-22).
  - >-
    The IAPWS coefficients and check values, the Benson-Krause-Peterson equation, Battino et al.'s Table 1 and the
    USGS memorandum's equations were each read from page images of the source.
  - >-
    Battino et al. print the same coefficients for their eq. (11) and eq. (16); since column b of their Table 1
    differs from what eq. (16) gives, the oxygen check uses the tabulated column b directly.
  - >-
    Solvay's data sheet gives 23.4 kcal/mol for 70% H2O2, while its 852 Btu/lb for the same grade works out to 23.0
    kcal/mol, the engine's value. The engine follows the NBS tables.
  - >-
    De Laat and Gallard's eq 24, as printed, drops the factor 2 that follows from their eqs 21 and 22. With the factor,
    kd at pH 3 is 0.51 L/(mol·s), beside the 0.47 ± 0.03 they measured; as printed it gives 0.25. The engine solves
    the full mechanism in time, so its rates are independent of this formula.
  - >-
    Each iron constant was read from page images of De Laat and Gallard (1999), Gallard, De Laat and Legube (1999),
    Gallard, De Laat and Legube (1998), Buxton et al. (1988) and Bielski et al. (1985). Where a compilation selects a
    different value, the constant's note gives it. The five hydroxyl radical constants De Laat and Gallard chose lie
    within 27% of Buxton's selections (Fe2+ + OH sits 26% below Buxton's best value and inside the range Buxton lists),
    and the constants for HO2 and O2⁻ reacting with each other, and their acid constant, are Bielski's.
  - >-
    The ionic-strength equations for iron(III) hydrolysis reproduce the constants the paper prints once the authors'
    own two roundings (log K to three decimals, then K to three figures) are applied; the check's pass rule records
    how that rounding rule was settled.
  - >-
    In Lousada's 2013 thesis, Table 3 (p. 42) gives the second-order constants of CeO2 and CuO exchanged: in Figure 16
    the CuO points climb about 2.7 × 10⁻⁸ m/s and the CeO2 points about 1.2 × 10⁻⁹ m/s, and the k1 values the same
    table prints follow the figure. The Fe2O3 k1 (2.1 × 10⁻⁴ per second at 4.5 m²) sits below the table's own line
    (4.7 × 10⁻⁴ there), and the surface-normalized TiO2 and Y2O3 constants give rates far below their measured k0.
    These oxides wait for the journal version (Lousada et al. 2012).
  - >-
    The platinum rate law of Serra-Maia et al. (2021) fits initial rates; its H2O2 and pH ranges are in the 2018
    paper's Supporting Information, so platinum waits for that paper.
  - >-
    NETZSCH Application Note 132 reports adiabatic steps for 8.6–35% H2O2, each covering part of the decomposition
    with an assumed heat capacity of 3.3 J/(g K), so it serves as a picture of runaway behavior rather than as a check
    of total heat.
