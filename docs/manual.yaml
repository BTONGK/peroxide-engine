intro: >-
  The peroxide engine computes what you would measure when hydrogen peroxide decomposes over a catalyst, from cited
  constants and checked models. This page walks through a run.

steps:
  - title: 1. Describe the catalyst
    body: >-
      Pick a catalyst. "A rate constant you supply" takes the first-order rate constant k of your catalyst at the
      run's temperature, in 1/s; if you know a half-life instead, k = 0.693 / half-life, and for a catalyst whose rate
      depends on its loading, use the k you measured at the loading you plan to simulate. "Dissolved iron(III) in
      perchloric acid" computes the rate itself from the iron mechanism: enter the iron added (50–1000 µmol/L) and the
      measured pH (1.0–3.2). The iron runs at 25.00 °C and ionic strength 0.1 M, the conditions the model was built
      and checked at, and the pH stays fixed through the run, as in a buffered or strongly acidic solution. "A
      measured catalyst from the library" runs a catalyst a laboratory measured, such as a ZrO2 or HfO2 powder: pick
      it, then set the loading in g/L and the temperature, each inside the range the laboratory measured. The Catalyst
      library page lists every catalyst with its source and ranges, and the paper each waiting catalyst needs.
  - title: 2. Describe the solution
    body: >-
      Set the starting H2O2 in mmol/L (up to 1000), the temperature (5–55 °C, or 25 °C for iron) and the room's
      pressure. The liquid starts saturated with air, as a solution open to the lab would be. Set the run length: a
      number of half-lives for a supplied k, or the share of the H2O2 to remove for iron, whose rate slows as it runs.
  - title: 3. Describe the apparatus
    body: >-
      Pick the gas arrangement: a gas burette at room pressure, a sealed vessel with a pressure gauge, or an open
      vessel. Set the liquid volume and the gas space above it (include tubing for a burette). Leave oxygen transfer at
      "in balance" for a well-stirred vessel, or enter your vessel's kLa to see the liquid supersaturate.
  - title: 4. Read the results
    body: >-
      The readouts table lists each number with its units and how it was computed. The charts show the H2O2 left, the
      gas or pressure, the dissolved oxygen and (at 25 °C) the heat flow over time. The titration panel gives the
      permanganate and thiosulfate volumes for an aliquot at any time. Download the full time series as CSV. For iron
      the table adds k_obs over the first 20% of the H2O2 (the measure De Laat and Gallard report) with its range over
      the one loosely known constant, the second-order constant kd, the share of iron bound to peroxide at the start
      and the free acid.
  - title: 5. Check the accuracy
    body: >-
      The Model checks page shows each comparison with published measurements and its verdict; the Methodology page
      lists every source, equation and limit.

  - title: 6. Compute a catalyst from its crystal
    body: >-
      On Compute a catalyst, find crystals in the Materials Project by formula (MnO2, Fe2O3) or by the elements they
      contain, with limits on the number of elements, the atoms in the cell and the energy above the convex hull
      (0 is the most stable form, and crystals a few hundredths of an eV per atom above it are often made in a lab). Tick the crystals to
      compute, pick the molecules to bind (OH by default) and press Compute. The engine cuts every face whose two
      sides match and whose dipole is zero, relaxes each with Meta's UMA model, keeps the face of lowest surface
      energy and binds each molecule on every site of it. Runs wait in a queue and compute one after another,
      about 5–30 minutes per crystal on this computer, and keep going when the page closes; the Runs tab shows
      progress, every face and site, and the structures as CIF files. Stop pauses a run, and Resume picks it up at
      its last finished relaxation.
  - title: 7. Find any number again
    body: >-
      Data collection holds every crystal, face and binding energy the engine has computed, from your runs, from
      screens prepared on the command line (pe screen) and from the model checks, each with the model and run that
      made it. Filter by formula, model or origin and download each table as CSV, or everything as JSON. Its
      Measured tab lists the laboratory values the computed data are tested against, each with its source.

glossary:
  - term: k_obs
    meaning: Rate constant fitted to ln[H2O2] against time, in 1/s.
  - term: Half-life
    meaning: Time for the H2O2 to fall to half its starting value.
  - term: Initial rate
    meaning: Slope of [H2O2] against time over the first 10% of the reaction, in mmol/L per second.
  - term: kd
    meaning: >-
      Second-order constant for iron catalysis, k_obs divided by the total iron(III), in L/(mol·s); the number most
      iron papers report.
  - term: kLa
    meaning: >-
      Oxygen transfer coefficient of the vessel, in 1/s; the rate oxygen leaves the liquid is kLa times its excess
      over saturation.
  - term: Air saturation
    meaning: Dissolved oxygen in water at balance with room air; 8.27 mg/L at 25 °C and 1 atm.
  - term: Dry gas at 0 °C and 1 atm
    meaning: The burette volume with water vapor removed and corrected to 0 °C and 101.325 kPa.
