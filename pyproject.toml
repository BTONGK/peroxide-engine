[project]
name = "peroxide-engine"
version = "0.1.0"
description = "Computes what an experimentalist measures when hydrogen peroxide decomposes, from cited constants and checked models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.14",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "altair>=5.4",
    "streamlit>=1.50",
    "pymatgen>=2025.1",
    "requests>=2.32",
    "ase>=3.23",
]

[project.scripts]
pe = "peroxide_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peroxide_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
